  <body class="min-h-screen text-white flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop py-space-xl md:py-space-2xl selection:bg-primary selection:text-on-primary">
  
  <div id="vanta-canvas" class="fixed inset-0 -z-10 h-screen w-full"></div>
  <div class="grain-overlay"></div>

  <main class="w-full mx-auto flex flex-col items-center justify-center transition-all duration-300 ease-out max-w-md relative z-10" id="mainContainer">
    <div class="flex flex-col w-full">
      <div class="w-full bg-transparent border border-white/20 hover:border-white/40 shadow-none p-6 md:p-8 flex flex-col transition-all duration-300 rounded-xl backdrop-blur-sm">
        
        <!-- Brand Mark -->
        <div class="flex items-center gap-2 mb-6 select-none">
          <div class="w-8 h-8 rounded-lg bg-white/10 border border-white/20 text-white flex items-center justify-center">
            <span class="material-symbols-outlined text-[18px]">terminal</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-xl text-white tracking-tight font-semibold">Coding Club</span>
          </div>
        </div>

        <!-- ================= LOGIN VIEW ================= -->
        <div class="flex-col w-full transition-opacity duration-200 flex" id="loginView">
          <!-- Title & Subtitle -->
          <div class="flex flex-col gap-1 mb-5 select-none">
            <h1 class="text-2xl text-white tracking-tight font-semibold" id="loginTitle">ADMIN Login</h1>
            <p class="text-base text-slate-300">Welcome back. Enter your institutional credentials.</p>
          </div>

          <!-- Role Toggle -->
          <div class="bg-white/5 border border-white/10 p-1 rounded-full flex mb-5 relative" id="roleToggleGroup" role="tablist">
            <button aria-selected="false" class="flex-1 py-1.5 px-4 rounded-full text-base text-slate-400 hover:text-white bg-transparent transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer" id="role-student" onclick="selectRole('student'); document.getElementById('loginTitle').textContent = 'Student Login';" role="tab" type="button">
              <span class="material-symbols-outlined text-[16px]">school</span>
              <span class="">Student</span>
            </button>
            <button aria-selected="true" class="flex-1 py-1.5 px-4 rounded-full text-base text-white bg-white/15 shadow-sm transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer" id="role-admin" onclick="selectRole('admin'); document.getElementById('loginTitle').textContent = 'ADMIN Login';" role="tab" type="button">
              <span class="material-symbols-outlined text-[16px]">shield_person</span>
              <span class="">Administrator</span>
            </button>
          </div>

          <!-- Login Form -->
          <form class="flex flex-col gap-4" onsubmit="event.preventDefault(); handleLoginSubmit();">
            <div class="flex flex-col gap-1.5">
              <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="email">Institutional Email</label>
              <div class="relative">
                <input autocomplete="email" class="w-full bg-transparent text-white placeholder:text-white/30 text-base px-3.5 py-2.5 rounded-lg outline-none border border-white/20 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all duration-150" id="email" name="email" placeholder="lead@codingclub.ac.uk" required type="email" />
              </div>
            </div>

            <!-- Password Field -->
            <div class="flex flex-col gap-1.5">
              <div class="flex items-center justify-between">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="password">Password</label>
                <a class="text-sm text-slate-400 hover:text-white transition-colors duration-150 select-none" href="#">Forgot password?</a>
              </div>
              <div class="relative flex items-center">
                <input autocomplete="current-password" class="w-full bg-transparent text-white placeholder:text-white/30 text-base px-3.5 py-2.5 pr-10 rounded-lg outline-none border border-white/20 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all duration-150" id="password" name="password" placeholder="••••••••••••" required type="password" />
                <button aria-label="Toggle password visibility" class="absolute right-3 text-slate-400 hover:text-white p-0.5 flex items-center justify-center cursor-pointer" onclick="togglePasswordVisibility()" type="button">
                  <span class="material-symbols-outlined text-[18px]" id="passwordToggleIcon">visibility</span>
                </button>
              </div>
            </div>

            <p aria-live="polite" class="hidden text-sm text-rose-300" id="loginMessage" role="status"></p>
            <!-- Remember Me -->
            <div class="flex items-center justify-between py-0.5">
              <label class="flex items-center gap-2 cursor-pointer select-none">
                <input class="w-4 h-4 rounded border-white/20 bg-transparent text-white focus:ring-0 cursor-pointer" id="remember" name="remember" type="checkbox" />
                <span class="text-base text-slate-300">Remember session for 30 days</span>
              </label>
            </div>

            <!-- CTA Button -->
            <button class="w-full group relative inline-flex items-center justify-center gap-2 py-3 text-lg font-medium text-white bg-white/10 border border-white/20 rounded-lg overflow-hidden transition-all duration-300 hover:bg-white/20 hover:border-white/40 active:scale-95 shadow-none mt-2 select-none cursor-pointer" id="submitBtn" type="submit">
              <span id="submitBtnText" class="">Sign In</span>
              <span class="material-symbols-outlined text-[18px] transition-transform duration-300 group-hover:translate-x-1" id="submitBtnIcon">arrow_forward</span>
            </button>
          </form>

          <!-- Registration Prompt -->
          <div class="text-center pt-5 border-t border-white/10 mt-5">
            <p class="text-base text-slate-400">
              Don't have an account?
              <button class="text-base text-white font-semibold hover:underline ml-1 cursor-pointer bg-transparent border-0 p-0 select-none" onclick="switchToRegister()" type="button">Register</button>
            </p>
          </div>
        </div>

        <!-- ================= STUDENT REGISTRATION VIEW ================= -->
        <div class="flex-col w-full transition-opacity duration-200 hidden" id="registerView">
          <!-- Header -->
          <div class="flex flex-col gap-1 mb-5 select-none">
            <h1 class="text-2xl text-white tracking-tight font-semibold" id="register-title">Student Registration</h1>
            <p class="text-base text-slate-300" id="register-description">Join the campus coding club cohort.</p>
          </div>

          <div class="bg-white/5 border border-white/10 p-1 rounded-full flex mb-5" role="group" aria-label="Registration type">
            <button class="flex-1 py-1.5 px-3 rounded-full text-sm text-white bg-white/15 transition-all" id="register-type-student" onclick="setRegistrationType('student')" type="button">Student</button>
            <button class="flex-1 py-1.5 px-3 rounded-full text-sm text-slate-400 hover:text-white transition-all" id="register-type-faculty" onclick="setRegistrationType('faculty')" type="button">Faculty</button>
            <button class="flex-1 py-1.5 px-3 rounded-full text-sm text-slate-400 hover:text-white transition-all" id="register-type-admin" onclick="setRegistrationType('admin')" type="button">Admin / Staff</button>
          </div>

          <!-- Registration Form -->
          <form class="flex flex-col gap-4" onsubmit="event.preventDefault(); handleRegisterSubmit();">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="reg-fullname">Full Name</label>
                <input class="w-full bg-transparent text-white placeholder:text-white/30 text-base px-3 py-2 rounded-lg outline-none border border-white/20 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all duration-150" id="reg-fullname" name="fullname" placeholder="Alex Johnson" required type="text" />
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="reg-gmail">Email</label>
                <input class="w-full bg-transparent text-white placeholder:text-white/30 text-base px-3 py-2 rounded-lg outline-none border border-white/20 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all duration-150" id="reg-gmail" name="gmail" placeholder="alex@example.com" required type="email" />
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="reg-password">Password</label>
                <input autocomplete="new-password" class="w-full bg-transparent text-white placeholder:text-white/30 text-base px-3 py-2 rounded-lg outline-none border border-white/20 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all duration-150" id="reg-password" minlength="8" name="password" placeholder="At least 8 characters" required type="password" />
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="reg-password-confirm">Confirm Password</label>
                <input autocomplete="new-password" class="w-full bg-transparent text-white placeholder:text-white/30 text-base px-3 py-2 rounded-lg outline-none border border-white/20 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all duration-150" id="reg-password-confirm" minlength="8" name="password-confirm" placeholder="Re-enter your password" required type="password" />
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="reg-phone">Phone Number</label>
                <input class="w-full bg-transparent text-white placeholder:text-white/30 text-base px-3 py-2 rounded-lg outline-none border border-white/20 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all duration-150" id="reg-phone" name="phone" placeholder="+1 (555) 019-2834" required type="tel" />
              </div>
              <div class="col-span-full grid grid-cols-1 sm:grid-cols-2 gap-3.5" id="student-registration-fields">
              <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="reg-enrollment">Enrollment Number</label>
                <input class="w-full bg-transparent text-white placeholder:text-white/30 text-base px-3 py-2 rounded-lg outline-none border border-white/20 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all duration-150" id="reg-enrollment" name="enrollment" placeholder="21012011001" required type="text" />
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="reg-roll">Roll Number</label>
                <input class="w-full bg-transparent text-white placeholder:text-white/30 text-base px-3 py-2 rounded-lg outline-none border border-white/20 focus:border-white/50 focus:ring-1 focus:ring-white/50 transition-all duration-150" id="reg-roll" name="roll" placeholder="42" required type="number" />
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="reg-program">Program Type</label>
                <div class="relative">
                  <select id="reg-program" name="program" required class="w-full h-9 px-3 pr-9 appearance-none bg-none bg-slate-900/60 border border-white/10 backdrop-blur-xl rounded text-white focus:outline-none focus:border-white/50 transition-colors [&>option]:bg-slate-900 [&>option]:text-white">
                    <option disabled selected value="">Select Program</option>
                    <option value="D2D">D2D</option>
                    <option value="B.E./B.Tech">B.E./B.Tech</option>
                  </select>
                  <span class="material-symbols-outlined absolute right-2.5 top-1/2 -translate-y-1/2 text-[18px] text-white/50 pointer-events-none">expand_more</span>
                </div>
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="reg-branch">Branch</label>
                <div class="relative">
                  <select id="reg-branch" name="branch" required class="w-full h-9 px-3 pr-9 appearance-none bg-none bg-slate-900/60 border border-white/10 backdrop-blur-xl rounded text-white focus:outline-none focus:border-white/50 transition-colors [&>option]:bg-slate-900 [&>option]:text-white">
                    <option disabled selected value="">Select Branch</option>
                    <option value="C.S.E">C.S.E</option>
                    <option value="AI/ML">AI/ML</option>
                    <option value="DATASCIENCE">DATASCIENCE</option>
                  </select>
                  <span class="material-symbols-outlined absolute right-2.5 top-1/2 -translate-y-1/2 text-[18px] text-white/50 pointer-events-none">expand_more</span>
                </div>
              </div>
              <div class="flex flex-col gap-1">
                <label class="text-xs text-slate-300 uppercase tracking-wider font-semibold" for="reg-division">Division</label>
                <div class="relative w-full">
                 <select id="reg-division" name="division" required class="w-full appearance-none bg-none h-9 px-3 pr-9 bg-slate-900/60 border border-white/10 backdrop-blur-xl rounded text-white focus:outline-none focus:border-white/50 transition-colors [&>option]:bg-slate-900 [&>option]:text-white">
                    <option disabled selected value="">Select Division</option>
                    <option value="D1">D1</option>
                    <option value="D2">D2</option>
                    <option value="D3">D3</option>
                    <option value="D4">D4</option>
                    <option value="D5">D5</option>
                    <option value="D6">D6</option>
                  </select>
                  <span class="material-symbols-outlined absolute right-2.5 top-1/2 -translate-y-1/2 text-[18px] text-white/50 pointer-events-none">expand_more</span>
                </div>
              </div>
              </div>
            </div>

            <p aria-live="polite" class="hidden text-sm text-rose-300" id="registerMessage" role="status"></p>
            <!-- Solid Register Button -->
            <button class="w-full group relative inline-flex items-center justify-center gap-2 py-3 text-lg font-medium text-white bg-white/10 border border-white/20 rounded-lg overflow-hidden transition-all duration-300 hover:bg-white/20 hover:border-white/40 active:scale-95 shadow-none mt-2 select-none cursor-pointer" id="registerSubmitBtn" type="submit">
              <span id="registerSubmitBtnText" class="">Register</span>
              <span class="material-symbols-outlined text-[16px] transition-transform duration-300 group-hover:scale-110">how_to_reg</span>
            </button>
          </form>

          <!-- Back to Login Link -->
          <div class="text-center pt-4 border-t border-white/10 mt-5">
            <button class="text-base text-slate-400 hover:text-white transition-colors inline-flex items-center gap-1.5 cursor-pointer bg-transparent border-0 p-0 select-none" onclick="switchToLogin()" type="button">
              <span class="material-symbols-outlined text-[16px]">arrow_back</span>
              <span class="">Already have an account? Sign In</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <script>
  function switchToRegister() {
    const mainContainer = document.getElementById('mainContainer');
    const loginView = document.getElementById('loginView');
    const registerView = document.getElementById('registerView');

    mainContainer.classList.remove('max-w-md');
    mainContainer.classList.add('max-w-xl');

    loginView.classList.add('hidden');
    loginView.classList.remove('flex');

    registerView.classList.remove('hidden');
    registerView.classList.add('flex');
  }

  function switchToLogin() {
    const mainContainer = document.getElementById('mainContainer');
    const loginView = document.getElementById('loginView');
    const registerView = document.getElementById('registerView');

    mainContainer.classList.remove('max-w-xl');
    mainContainer.classList.add('max-w-md');

    registerView.classList.add('hidden');
    registerView.classList.remove('flex');

    loginView.classList.remove('hidden');
    loginView.classList.add('flex');
  }

  let registrationType = 'student';

  function setRegistrationType(type) {
    registrationType = type;
    const isStudent = type === 'student';
    const studentFields = document.getElementById('student-registration-fields');
    studentFields.classList.toggle('hidden', !isStudent);
    studentFields.querySelectorAll('input, select').forEach(field => {
      field.required = isStudent;
    });

    const labels = {
      student: ['Student Registration', 'Join the campus coding club cohort.'],
      faculty: ['Faculty Registration', 'Faculty applications require administrator approval.'],
      admin: ['Admin / Staff Registration', 'An administrator will review your application and assign staff access.'],
    };
    document.getElementById('register-title').textContent = labels[type][0];
    document.getElementById('register-description').textContent = labels[type][1];

    ['student', 'faculty', 'admin'].forEach(option => {
      const button = document.getElementById(`register-type-${option}`);
      const selected = option === type;
      button.className = selected
        ? 'flex-1 py-1.5 px-3 rounded-full text-sm text-white bg-white/15 transition-all'
        : 'flex-1 py-1.5 px-3 rounded-full text-sm text-slate-400 hover:text-white transition-all';
      button.setAttribute('aria-pressed', String(selected));
    });
  }

  function selectRole(role) {
    const studentBtn = document.getElementById('role-student');
    const adminBtn = document.getElementById('role-admin');
    const emailInput = document.getElementById('email');

    if (role === 'student') {
      studentBtn.className = "flex-1 py-1.5 px-4 rounded-full text-base text-white bg-white/15 shadow-sm transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer";
      studentBtn.setAttribute('aria-selected', 'true');
      adminBtn.className = "flex-1 py-1.5 px-4 rounded-full text-base text-slate-400 hover:text-white bg-transparent transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer";
      adminBtn.setAttribute('aria-selected', 'false');
      emailInput.placeholder = "alex@university.edu";
    } else {
      adminBtn.className = "flex-1 py-1.5 px-4 rounded-full text-base text-white bg-white/15 shadow-sm transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer";
      adminBtn.setAttribute('aria-selected', 'true');
      studentBtn.className = "flex-1 py-1.5 px-4 rounded-full text-base text-slate-400 hover:text-white bg-transparent transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer";
      studentBtn.setAttribute('aria-selected', 'false');
      emailInput.placeholder = "lead@codingclub.ac.uk";
    }
  }

  function togglePasswordVisibility() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('passwordToggleIcon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwd.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function showFormMessage(elementId, message, isError = true) {
    const element = document.getElementById(elementId);
    element.textContent = message;
    element.classList.toggle('hidden', !message);
    element.classList.toggle('text-rose-300', isError);
    element.classList.toggle('text-emerald-300', !isError);
  }

  function getApiErrorMessage(data) {
    if (data.detail) return data.detail;
    return Object.values(data).flat().join(' ');
  }

  async function handleLoginSubmit() {
    const btn = document.getElementById('submitBtn');
    const originalContent = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin">progress_activity</span><span>Verifying...</span>`;
    showFormMessage('loginMessage', '');
    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(getApiErrorMessage(data));

      sessionStorage.setItem('authToken', data.token);
      sessionStorage.setItem('authUser', JSON.stringify(data.user));
      const destinations = {
        student: '/preview/student/',
        faculty: '/preview/faculty/',
        supervisor: '/preview/supervisor/',
        superuser: '/preview/supervisor/',
      };
      window.location.assign(destinations[data.user.role] || '/preview/');
    } catch (error) {
      showFormMessage('loginMessage', error.message || 'Unable to sign in. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalContent;
    }
  }

  async function handleRegisterSubmit() {
    const btn = document.getElementById('registerSubmitBtn');
    const originalContent = btn.innerHTML;
    const password = document.getElementById('reg-password').value;
    if (password !== document.getElementById('reg-password-confirm').value) {
      showFormMessage('registerMessage', 'Passwords do not match.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin">progress_activity</span><span>Submitting application...</span>`;
    showFormMessage('registerMessage', '');
    try {
      const payload = {
        name: document.getElementById('reg-fullname').value,
        email: document.getElementById('reg-gmail').value,
        phone: document.getElementById('reg-phone').value,
        password,
      };
      let endpoint = '/api/auth/admin/register';
      if (registrationType === 'student') {
        endpoint = '/api/auth/student/register';
        Object.assign(payload, {
          enrollment_number: document.getElementById('reg-enrollment').value,
          division_roll_number: document.getElementById('reg-roll').value,
          branch: document.getElementById('reg-branch').value,
          division: document.getElementById('reg-division').value,
        });
      } else {
        payload.requested_role = registrationType === 'faculty' ? 'faculty' : '';
      }

      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(getApiErrorMessage(data));

      document.querySelector('#registerView form').reset();
      showFormMessage('registerMessage', data.detail, false);
    } catch (error) {
      showFormMessage('registerMessage', error.message || 'Unable to register. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalContent;
    }
  }
  </script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
  {% load static %}
  <script src="{% static 'background.js' %}"></script>
  </body>
</html>
