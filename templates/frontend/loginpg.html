</head><body class="min-h-screen bg-surface text-on-surface flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop py-space-xl md:py-space-2xl selection:bg-primary selection:text-on-primary"><main class="w-full mx-auto flex flex-col items-center justify-center transition-all duration-300 ease-out max-w-md" id="mainContainer"><div class="flex flex-col w-full">

<label class="text-xs text-on-surface uppercase tracking-wider font-semibold" for="reg-gmail">Gmail</label>

</div>
<div class="flex flex-col gap-1">
<label class="text-xs text-on-surface uppercase tracking-wider font-semibold" for="reg-password">Password</label>
<input autocomplete="new-password" class="w-full bg-surface-container-low text-on-surface placeholder:text-outline text-base px-3 py-2 rounded-lg outline-none border border-transparent focus:border-outline-variant focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary transition-all duration-150" id="reg-password" minlength="8" name="password" placeholder="At least 8 characters" required="" type="password">

<!-- 4. Enrollment Number -->
<div class="flex flex-col gap-1">
<label class="text-xs text-on-surface uppercase tracking-wider font-semibold" for="reg-enrollment">Enrollment Number</label>
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-outline text-base px-3 py-2 rounded-lg outline-none border border-transparent focus:border-outline-variant focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary transition-all duration-150" id="reg-enrollment" name="enrollment" placeholder="21012011001" required="" type="text">
</div>

<label class="text-xs text-on-surface uppercase tracking-wider font-semibold" for="reg-roll">Roll Number</label>

<!-- 6. Program Type -->

<option disabled="" selected="" value="">Select Branch</option>
<option value="C.S.E">C.S.E</option>
<option value="AI/ML">AI/ML</option>
<option value="DATASCIENCE">DATASCIENCE</option>
</select>

</div>
</div>
<!-- 8. Division -->
<div class="flex flex-col gap-1">
<label class="text-xs text-on-surface uppercase tracking-wider font-semibold" for="reg-division">Division</label>

<select class="w-full bg-surface-container-low text-on-surface text-base px-3 py-2 rounded-lg outline-none border border-transparent focus:border-outline-variant focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary transition-all duration-150 appearance-none cursor-pointer pr-8" id="reg-division" name="division" required="">
<option disabled="" selected="" value="">Select Division</option>
<option value="D1">D1</option>
<option value="D2">D2</option>

<span id="registerSubmitBtnText" class="">Register</span>
<span class="material-symbols-outlined text-[16px]">how_to_reg</span>
</button>

<!-- Back to Login Link -->
<div class="text-center pt-4 border-t border-surface-container mt-5">
<button class="text-base text-secondary hover:text-on-surface transition-colors inline-flex items-center gap-1.5 cursor-pointer bg-transparent border-0 p-0 select-none" onclick="switchToLogin()" type="button">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
<span class="">Already have an account? Sign In</span>

</main>
<script>
  function switchToRegister() {
    const mainContainer = document.getElementById('mainContainer');
    const loginView = document.getElementById('loginView');
    const registerView = document.getElementById('registerView');

    mainContainer.classList.remove('max-w-md');
    mainContainer.classList.add('max-w-xl');

    loginView.classList.add('hidden');
    loginView.classList.remove('flex');

    registerView.classList.remove('hidden');
    registerView.classList.add('flex');
  }

  function switchToLogin() {
    const mainContainer = document.getElementById('mainContainer');
    const loginView = document.getElementById('loginView');
    const registerView = document.getElementById('registerView');

    mainContainer.classList.remove('max-w-xl');
    mainContainer.classList.add('max-w-md');

    registerView.classList.add('hidden');
    registerView.classList.remove('flex');

    loginView.classList.remove('hidden');
    loginView.classList.add('flex');
  }

  function selectRole(role) {
    const studentBtn = document.getElementById('role-student');
    const adminBtn = document.getElementById('role-admin');
    const emailInput = document.getElementById('email');

    if (role === 'student') {
      studentBtn.className = "flex-1 py-1.5 px-4 rounded-full text-base text-on-surface bg-surface-container-lowest shadow-sm transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer";
      studentBtn.setAttribute('aria-selected', 'true');
      adminBtn.className = "flex-1 py-1.5 px-4 rounded-full text-base text-secondary hover:text-on-surface transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer";
      adminBtn.setAttribute('aria-selected', 'false');
      emailInput.placeholder = "alex@university.edu";
    } else {
      adminBtn.className = "flex-1 py-1.5 px-4 rounded-full text-base text-on-surface bg-surface-container-lowest shadow-sm transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer";
      adminBtn.setAttribute('aria-selected', 'true');
      studentBtn.className = "flex-1 py-1.5 px-4 rounded-full text-base text-secondary hover:text-on-surface transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer";
      studentBtn.setAttribute('aria-selected', 'false');
      emailInput.placeholder = "lead@codingclub.ac.uk";
    }
  }

  function togglePasswordVisibility() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('passwordToggleIcon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwd.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function showFormMessage(elementId, message, isError = true) {
    const element = document.getElementById(elementId);
    element.textContent = message;
    element.classList.toggle('hidden', !message);
    element.classList.toggle('text-error', isError);
    element.classList.toggle('text-secondary', !isError);
  }

  function getApiErrorMessage(data) {
    if (data.detail) return data.detail;
    return Object.values(data).flat().join(' ');
  }

  async function handleLoginSubmit() {
    const btn = document.getElementById('submitBtn');
    const originalContent = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin">progress_activity</span><span>Verifying...</span>`;
    showFormMessage('loginMessage', '');
    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(getApiErrorMessage(data));

      sessionStorage.setItem('authToken', data.token);
      sessionStorage.setItem('authUser', JSON.stringify(data.user));
      const destinations = {
        student: '/preview/student/',
        faculty: '/preview/faculty/',
        supervisor: '/preview/supervisor/',
        superuser: '/preview/supervisor/',
      };
      window.location.assign(destinations[data.user.role] || '/preview/');
    } catch (error) {
      showFormMessage('loginMessage', error.message || 'Unable to sign in. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalContent;
    }
  }

  async function handleRegisterSubmit() {
    const btn = document.getElementById('registerSubmitBtn');
    const originalContent = btn.innerHTML;
    const password = document.getElementById('reg-password').value;
    if (password !== document.getElementById('reg-password-confirm').value) {
      showFormMessage('registerMessage', 'Passwords do not match.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined text-[16px] animate-spin">progress_activity</span><span>Creating cohort profile...</span>`;
    showFormMessage('registerMessage', '');
    try {
      const response = await fetch('/api/auth/student/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('reg-fullname').value,
          email: document.getElementById('reg-gmail').value,
          phone: document.getElementById('reg-phone').value,
          enrollment_number: document.getElementById('reg-enrollment').value,
          division_roll_number: document.getElementById('reg-roll').value,
          branch: document.getElementById('reg-branch').value,
          division: document.getElementById('reg-division').value,
          password,
        }),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(getApiErrorMessage(data));

      document.getElementById('email').value = document.getElementById('reg-gmail').value;
      selectRole('student');
      document.getElementById('loginTitle').textContent = 'Student Login';
      switchToLogin();
      showFormMessage('loginMessage', data.detail, false);
    } catch (error) {
      showFormMessage('registerMessage', error.message || 'Unable to register. Please try again.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalContent;
    }
  }
</script>
